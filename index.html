<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animal Herd Detection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #111827;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
    }
    .upload-box {
      border: 2px dashed #334155;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #020617;
    }
    button {
      background: #22c55e;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .preview img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: 420px;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 10px;
      background: #020617;
    }
    .note {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Animal Herd Detection (Flask + YOLO)</h2>

    <form method="POST" enctype="multipart/form-data" class="upload-box">
      <input type="file" name="image" accept="image/*" required>
      <br><br>
      <button type="submit">Detect Animals</button>
    </form>

    {% if result_image %}
      <div class="preview">
        <h3>Detection Result</h3>
        <img src="{{ result_image }}">
      </div>
    {% endif %}

    {% if map_path %}
      <h3>Detected Herd Location (Map Alert)</h3>
      <iframe src="{{ map_path }}"></iframe>
    {% endif %}

    <div class="note">
      Map rendered using Folium (tiles from OpenStreetMap) · Location via NASA API
    </div>
  </div>
</body>
</html>
